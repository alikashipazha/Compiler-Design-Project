[pytest]
# Preserves your local python path mapping so python finds cc_analyzer package
pythonpath = src

# Directory where pytest looks for test files
testpaths = tests

# Naming convention for test modules
python_files = test_*.py

# Default CLI options: runs coverage on src/, prints missing lines, and generates HTML web reports
addopts = --cov=src --cov-report=term-missing --cov-report=html