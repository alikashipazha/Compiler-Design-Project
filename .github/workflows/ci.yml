name: CC-IDE Front-End CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Grant permissions to write GitHub Pages deployment artifacts
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test_and_analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Test Suite with Coverage
        run: |
          python -m pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Generate Static Web Highlight Report
        run: |
          python generate_report.py

      - name: Setup GitHub Pages Environment
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload Static Web Page Artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy_to_pages:
    needs: test_and_analyze
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages Website
        id: deployment
        uses: actions/deploy-pages@v4